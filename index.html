<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Chess (AI Bot)</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <style>
    /* Prevent iPad / mobile zooming and dragging gestures */
    html, body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding-top: 20px;
    }

    #board {
      width: 90vw;
      max-width: 400px;
      margin: 10px 0;
      touch-action: none; /* Disables default tablet pinch/scroll over board */
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .btn-green { background: #4CAF50; color: white; font-weight: bold; }
    .btn-orange { background: #ff9800; color: white; font-weight: bold; }
    .btn-blue { background: #2196F3; color: white; font-weight: bold; }
    #status { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #4CAF50; }
    
    .captured-panel {
      width: 90vw;
      max-width: 400px;
      font-size: 18px;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
    }
    
    .highlight-square { background-color: rgba(255, 255, 0, 0.5) !important; }
    .highlight-move { background-color: rgba(0, 255, 0, 0.4) !important; }
  </style>
</head>
<body>
  <h1>Web Chess (AI Bot)</h1>
  
  <div id="status">White's Turn</div>

  <div class="controls">
    <label for="user-color">Play As: </label>
    <select id="user-color" onchange="resetGame()">
      <option value="w" selected>White</option>
      <option value="b">Black</option>
    </select>

    <label for="difficulty">Level: </label>
    <select id="difficulty">
      <option value="1">Lvl 1 - Novice</option>
      <option value="2">Lvl 2 - Casual</option>
      <option value="3" selected>Lvl 3 - Intermediate</option>
      <option value="4">Lvl 4 - Advanced</option>
      <option value="5">Lvl 5 - Expert</option>
    </select>

    <button class="btn-blue" onclick="switchSides()">Swap Sides</button>
    <button class="btn-orange" onclick="undoMove()">Undo</button>
    <button class="btn-green" onclick="resetGame()">New Game</button>
  </div>

  <div class="captured-panel" id="top-captured"></div>
  <div id="board"></div>
  <div class="captured-panel" id="bottom-captured"></div>

  <script>
    // Prevent double-tap zoom on iPad/iOS
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    const game = new Chess();
    let board = null;
    let userColor = 'w';

    const pieceValues = { p: 100, r: 500, n: 320, b: 330, q: 900, k: 20000 };
    const pieceSymbols = {
      w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕' },
      b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛' }
    };

    // Positional evaluation tables (PSTs) to make bot prioritize central control and safety
    const pawnEval = [
      [0,  0,  0,  0,  0,  0,  0,  0],
      [50, 50, 50, 50, 50, 50, 50, 50],
      [10, 10, 20, 30, 30, 20, 10, 10],
      [5,  5, 10, 27, 27, 10,  5,  5],
      [0,  0,  0, 25, 25,  0,  0,  0],
      [5, -5,-10,  0,  0,-10, -5,  5],
      [5, 10, 10,-25,-25, 10, 10,  5],
      [0,  0,  0,  0,  0,  0,  0,  0]
    ];

    const knightEval = [
      [-50,-40,-30,-30,-30,-30,-40,-50],
      [-40,-20,  0,  0,  0,  0,-20,-40],
      [-30,  0, 10, 15, 15, 10,  0,-30],
      [-30,  5, 15, 20, 20, 15,  5,-30],
      [-30,  0, 15, 20, 20, 15,  0,-30],
      [-30,  5, 10, 15, 15, 10,  5,-30],
      [-40,-20,  0,  5,  5,  0,-20,-40],
      [-50,-40,-30,-30,-30,-30,-40,-50]
    ];

    const bishopEval = [
      [-20,-10,-10,-10,-10,-10,-10,-20],
      [-10,  0,  0,  0,  0,  0,  0,-10],
      [-10,  0,  5, 10, 10,  5,  0,-10],
      [-10,  5,  5, 10, 10,  5,  5,-10],
      [-10,  0, 10, 10, 10, 10,  0,-10],
      [-10, 10, 10, 10, 10, 10, 10,-10],
      [-10,  5,  0,  0,  0,  0,  5,-10],
      [-20,-10,-10,-10,-10,-10,-10,-20]
    ];

    const rookEval = [
      [0,  0,  0,  0,  0,  0,  0,  0],
      [5, 10, 10, 10, 10, 10, 10,  5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [0,  0,  0,  5,  5,  0,  0,  0]
    ];

    const queenEval = [
      [-20,-10,-10, -5, -5,-10,-10,-20],
      [-10,  0,  0,  0,  0,  0,  0,-10],
      [-10,  0,  5,  5,  5,  5,  0,-10],
      [-5,  0,  5,  5,  5,  5,  0, -5],
      [0,  0,  5,  5,  5,  5,  0, -5],
      [-10,  5,  5,  5,  5,  5,  0,-10],
      [-10,  0,  5,  0,  0,  0,  0,-10],
      [-20,-10,-10, -5, -5,-10,-10,-20]
    ];

    const kingEval = [
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-20,-30,-30,-40,-40,-30,-30,-20],
      [-10,-20,-20,-20,-20,-20,-20,-10],
      [20, 20,  0,  0,  0,  0, 20, 20],
      [20, 30, 10,  0,  0, 10, 30, 20]
    ];

    function removeHighlights() {
      $('#board .square-55d63').removeClass('highlight-square highlight-move');
    }

    function highlightSquare(square, className) {
      $(`#board .square-${square}`).addClass(className);
    }

    function updateCapturedPieces() {
      const initialCounts = { p: 8, r: 2, n: 2, b: 2, q: 1, k: 1 };
      const currentCounts = { w: { p: 0, r: 0, n: 0, b: 0, q: 0, k: 0 }, b: { p: 0, r: 0, n: 0, b: 0, q: 0, k: 0 } };

      game.board().forEach(row => {
        row.forEach(piece => {
          if (piece) currentCounts[piece.color][piece.type]++;
        });
      });

      let capturedByWhite = '';
      let capturedByBlack = '';

      ['p', 'n', 'b', 'r', 'q'].forEach(type => {
        const missingBlack = initialCounts[type] - currentCounts['b'][type];
        const missingWhite = initialCounts[type] - currentCounts['w'][type];
        if (missingBlack > 0) capturedByWhite += pieceSymbols.b[type].repeat(missingBlack);
        if (missingWhite > 0) capturedByBlack += pieceSymbols.w[type].repeat(missingWhite);
      });

      if (userColor === 'w') {
        $('#top-captured').html('Bot (Black): <span>' + capturedByBlack + '</span>');
        $('#bottom-captured').html('You (White): <span>' + capturedByWhite + '</span>');
      } else {
        $('#top-captured').html('Bot (White): <span>' + capturedByWhite + '</span>');
        $('#bottom-captured').html('You (Black): <span>' + capturedByBlack + '</span>');
      }
    }

    function updateStatus() {
      let statusText = '';
      const turnName = game.turn() === 'w' ? "White" : "Black";
      const isUserTurn = game.turn() === userColor;

      if (game.in_checkmate()) {
        statusText = `Game Over: ${game.turn() === 'w' ? 'Black' : 'White'} wins by Checkmate!`;
      } else if (game.in_draw()) {
        statusText = 'Game Over: Draw / Stalemate!';
      } else {
        statusText = isUserTurn ? `Your Turn (${turnName})` : `Bot is thinking... (${turnName})`;
        if (game.in_check()) statusText += ' (Check!)';
      }

      $('#status').text(statusText);
      updateCapturedPieces();
    }

    function showLegalMoves(square) {
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;
      highlightSquare(square, 'highlight-square');
      for (let i = 0; i < moves.length; i++) {
        highlightSquare(moves[i].to, 'highlight-move');
      }
    }

    function onDragStart(source, piece) {
      if (game.game_over() || game.turn() !== userColor) return false;
      const pieceColor = piece.search(/^w/) !== -1 ? 'w' : 'b';
      if (pieceColor !== userColor) return false;
      showLegalMoves(source);
    }

    function onDrop(source, target) {
      removeHighlights();
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      
      updateStatus();
      window.setTimeout(makeBotMove, 250);
    }

    function onMouseoverSquare(square, piece) {
      if (piece && game.turn() === userColor) {
        const pieceColor = piece.search(/^w/) !== -1 ? 'w' : 'b';
        if (pieceColor === userColor) showLegalMoves(square);
      }
    }

    function onMouseoutSquare() {
      removeHighlights();
    }

    function getPieceValue(piece, x, y) {
      if (!piece) return 0;
      let val = pieceValues[piece.type];
      let pTable;

      switch(piece.type) {
        case 'p': pTable = pawnEval; break;
        case 'n': pTable = knightEval; break;
        case 'b': pTable = bishopEval; break;
        case 'r': pTable = rookEval; break;
        case 'q': pTable = queenEval; break;
        case 'k': pTable = kingEval; break;
      }

      // Reverse row coordinate for white pieces
      let positionVal = piece.color === 'w' ? pTable[7 - x][y] : pTable[x][y];
      return val + positionVal;
    }

    function evaluateBoard(boardState) {
      let totalEvaluation = 0;
      const botColor = userColor === 'w' ? 'b' : 'w';

      for (let x = 0; x < 8; x++) {
        for (let y = 0; y < 8; y++) {
          const piece = boardState[x][y];
          if (piece) {
            const val = getPieceValue(piece, x, y);
            totalEvaluation += piece.color === botColor ? val : -val;
          }
        }
      }
      return totalEvaluation;
    }

    function minimax(depth, alpha, beta, isMaximizing) {
      if (depth === 0 || game.game_over()) return evaluateBoard(game.board());

      const moves = game.moves();
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let move of moves) {
          game.move(move);
          let evaluation = minimax(depth - 1, alpha, beta, false);
          game.undo();
          maxEval = Math.max(maxEval, evaluation);
          alpha = Math.max(alpha, evaluation);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let move of moves) {
          game.move(move);
          let evaluation = minimax(depth - 1, alpha, beta, true);
          game.undo();
          minEval = Math.min(minEval, evaluation);
          beta = Math.min(beta, evaluation);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function getBestMove(depth) {
      const moves = game.moves();
      let bestMove = null;
      let bestValue = -Infinity;

      for (let move of moves) {
        game.move(move);
        let boardValue = minimax(depth - 1, -Infinity, Infinity, false);
        game.undo();
        if (boardValue > bestValue) {
          bestValue = boardValue;
          bestMove = move;
        }
      }
      return bestMove;
    }

    function makeBotMove() {
      const moves = game.moves();
      if (game.game_over() || moves.length === 0 || game.turn() === userColor) return;

      const level = parseInt($('#difficulty').val());
      let chosenMove;

      if (level === 1) {
        // Pure Random
        chosenMove = moves[Math.floor(Math.random() * moves.length)];
      } else if (level === 2) {
        // Shallow search with 30% chance of random mistake
        if (Math.random() < 0.3) {
          chosenMove = moves[Math.floor(Math.random() * moves.length)];
        } else {
          chosenMove = getBestMove(1);
        }
      } else if (level === 3) {
        // Depth 2 with PST positional weighting
        chosenMove = getBestMove(2);
      } else if (level === 4) {
        // Depth 3 search
        chosenMove = getBestMove(3);
      } else {
        // Depth 3 + positional evaluation (Expert)
        chosenMove = getBestMove(3);
      }

      game.move(chosenMove);
      board.position(game.fen());
      updateStatus();
    }

    function undoMove() {
      if (game.history().length >= 2) {
        game.undo();
        game.undo();
      } else {
        resetGame();
        return;
      }
      board.position(game.fen());
      removeHighlights();
      updateStatus();
    }

    function switchSides() {
      userColor = userColor === 'w' ? 'b' : 'w';
      $('#user-color').val(userColor);
      resetGame();
    }

    function resetGame() {
      game.reset();
      userColor = $('#user-color').val();
      
      board.orientation(userColor === 'w' ? 'white' : 'black');
      board.start();
      removeHighlights();
      updateStatus();

      if (userColor === 'b') {
        window.setTimeout(makeBotMove, 400);
      }
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onMouseoverSquare: onMouseoverSquare,
      onMouseoutSquare: onMouseoutSquare,
      onSnapEnd: () => board.position(game.fen())
    });

    resetGame();
  </script>
</body>
</html>
